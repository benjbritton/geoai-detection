# SpaceNet 2 building detector: Mask R-CNN R50-FPN, one class (building).
#
# Self-contained: detectron2's Base-RCNN-FPN.yaml and
# COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x.yaml (commit a2f4a877) merged
# with the project overrides in configs/spacenet2_mask_rcnn_R50_FPN.yaml of
# github.com/benjbritton/geoai-detection. Unlisted keys take detectron2 defaults
# (including INPUT.FORMAT "BGR" and INPUT.MIN_SIZE_TEST 800).
#
# Load with:
#   cfg = get_cfg(); cfg.merge_from_file("config.yaml")

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHTS: "model_final.pth"
  MASK_ON: True
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
  RESNETS:
    DEPTH: 50
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
  ANCHOR_GENERATOR:
    SIZES: [[32], [64], [128], [256], [512]]
    ASPECT_RATIOS: [[0.5, 1.0, 2.0]]
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 1000
  ROI_HEADS:
    NAME: "StandardROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    NUM_CLASSES: 1
    BATCH_SIZE_PER_IMAGE: 512
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    POOLER_RESOLUTION: 7
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    POOLER_RESOLUTION: 14
DATASETS:
  TRAIN: ()
  TEST: ()
DATALOADER:
  FILTER_EMPTY_ANNOTATIONS: False
SOLVER:
  IMS_PER_BATCH: 16
  BASE_LR: 0.02
  WARMUP_ITERS: 1000
  STEPS: (4000, 5500)
  MAX_ITER: 6000
  CHECKPOINT_PERIOD: 1000
  AMP:
    ENABLED: True
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MASK_FORMAT: "polygon"
SEED: 0
VERSION: 2
